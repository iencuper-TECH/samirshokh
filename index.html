<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тестовая система - Университет</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg: #f8fafc;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }
        
        .container {
            width: 100%;
            max-width: 500px;
        }
        
        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            animation: slideUp 0.5s ease;
        }
        
        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .header {
            background: var(--primary);
            color: white;
            padding: 25px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 14px;
        }
        
        .content {
            padding: 25px;
        }
        
        .form-group {
            margin-bottom: 18px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #374151;
            font-weight: 600;
            font-size: 13px;
        }
        
        .form-control {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s;
        }
        
        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
        
        .btn {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        
        .btn:hover {
            background: #4338ca;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.2);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn-success {
            background: var(--success);
        }
        
        .btn-success:hover {
            background: #0da271;
        }
        
        .btn-warning {
            background: var(--warning);
        }
        
        .btn-warning:hover {
            background: #d97706;
        }
        
        .btn-danger {
            background: var(--danger);
        }
        
        .btn-danger:hover {
            background: #dc2626;
        }
        
        .hidden {
            display: none !important;
        }
        
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: #f9fafb;
            border-bottom: 1px solid #e5e7eb;
        }
        
        .timer {
            background: var(--danger);
            color: white;
            padding: 6px 12px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 14px;
            white-space: nowrap;
        }
        
        .question-counter {
            font-size: 14px;
            color: #6b7280;
            font-weight: 600;
        }
        
        /* Улучшенная сетка вопросов для мобильных */
        .question-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            padding: 15px;
            background: #f9fafb;
        }
        
        .grid-item {
            height: 35px;
            min-width: 35px;
            background: white;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .grid-item:hover {
            border-color: var(--primary);
            transform: scale(1.05);
        }
        
        .grid-item.active {
            border-color: var(--primary);
            background: var(--primary);
            color: white;
        }
        
        .grid-item.done {
            background: var(--success);
            color: white;
            border-color: var(--success);
        }
        
        .question-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            min-height: 400px;
        }
        
        /* Улучшенный контейнер для вопроса */
        .question-container {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .question-text {
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 20px;
            color: #1f2937;
            background: #f8fafc;
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid var(--primary);
            word-break: break-word;
            overflow-wrap: break-word;
            white-space: normal;
            max-height: none;
            overflow: visible;
            flex-shrink: 0;
        }
        
        /* Улучшенный контейнер для вариантов ответов */
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
            overflow-y: auto;
            padding-right: 5px;
            max-height: 350px;
        }
        
        /* Улучшенные кнопки ответов */
        .option {
            padding: 15px;
            background: white;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            text-align: left;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            word-break: break-word;
            overflow-wrap: break-word;
            white-space: normal;
            line-height: 1.4;
            min-height: 60px;
            display: flex;
            align-items: center;
            text-align: left;
        }
        
        .option:hover {
            border-color: var(--primary);
            background: #f5f3ff;
        }
        
        .option.selected {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        
        .option.correct {
            background: #d1fae5;
            border-color: var(--success);
            color: #065f46;
        }
        
        .option.wrong {
            background: #fee2e2;
            border-color: var(--danger);
            color: #991b1b;
        }
        
        /* Полоса прокрутки для вариантов ответов */
        .options-container::-webkit-scrollbar {
            width: 6px;
        }
        
        .options-container::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 3px;
        }
        
        .options-container::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 3px;
        }
        
        .options-container::-webkit-scrollbar-thumb:hover {
            background: #a1a1a1;
        }
        
        .navigation {
            display: flex;
            gap: 10px;
            padding: 15px;
            background: #f9fafb;
            border-top: 1px solid #e5e7eb;
        }
        
        .navigation .btn {
            flex: 1;
            padding: 12px;
            font-size: 14px;
        }
        
        .result-screen {
            text-align: center;
            padding: 30px 20px;
        }
        
        .result-score {
            font-size: 60px;
            font-weight: 800;
            color: var(--primary);
            margin: 15px 0;
            line-height: 1;
        }
        
        .result-message {
            font-size: 16px;
            color: #6b7280;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        
        .result-actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .dev-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #9ca3af;
            font-size: 12px;
            text-decoration: none;
        }
        
        .dev-link:hover {
            color: var(--primary);
        }
        
        .report-btn {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 12px;
            cursor: pointer;
            text-decoration: underline;
            margin-top: 15px;
            padding: 8px;
            align-self: flex-start;
        }
        
        .report-btn:hover {
            color: var(--danger);
        }
        
        /* Адаптация для очень маленьких экранов */
        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            
            .container {
                padding: 5px;
            }
            
            .header {
                padding: 20px 15px;
            }
            
            .header h1 {
                font-size: 20px;
            }
            
            .header p {
                font-size: 13px;
            }
            
            .content {
                padding: 20px;
            }
            
            .question-grid {
                grid-template-columns: repeat(5, 1fr);
                gap: 5px;
                padding: 12px;
            }
            
            .grid-item {
                height: 32px;
                min-width: 32px;
                font-size: 11px;
            }
            
            .question-content {
                padding: 15px;
                min-height: 350px;
            }
            
            .question-text {
                font-size: 15px;
                padding: 12px;
                line-height: 1.4;
                margin-bottom: 15px;
            }
            
            .option {
                font-size: 13px;
                padding: 12px;
                min-height: 55px;
            }
            
            .options-container {
                max-height: 300px;
            }
            
            .result-score {
                font-size: 50px;
            }
            
            .timer {
                font-size: 12px;
                padding: 5px 10px;
            }
        }
        
        /* Для экстремально маленьких экранов */
        @media (max-width: 360px) {
            .question-grid {
                grid-template-columns: repeat(4, 1fr);
            }
            
            .grid-item {
                height: 30px;
                min-width: 30px;
                font-size: 10px;
            }
            
            .question-text {
                font-size: 14px;
                padding: 10px;
            }
            
            .option {
                font-size: 12px;
                padding: 10px;
                min-height: 50px;
            }
            
            .btn {
                padding: 12px;
                font-size: 14px;
            }
            
            .form-control {
                padding: 10px 12px;
                font-size: 14px;
            }
            
            .question-content {
                min-height: 320px;
            }
            
            .options-container {
                max-height: 280px;
            }
        }
        
        /* Для горизонтальной ориентации на мобильных */
        @media (max-height: 600px) and (orientation: landscape) {
            .question-content {
                min-height: 250px;
            }
            
            .options-container {
                max-height: 200px;
            }
            
            .question-grid {
                grid-template-columns: repeat(8, 1fr);
            }
        }
        
        /* Для планшетов и больших экранов */
        @media (min-width: 768px) {
            .container {
                max-width: 600px;
            }
            
            .question-grid {
                grid-template-columns: repeat(6, 1fr);
            }
            
            .grid-item {
                height: 40px;
                min-width: 40px;
                font-size: 14px;
            }
            
            .question-text {
                font-size: 18px;
            }
            
            .option {
                font-size: 16px;
                padding: 16px;
            }
        }
    </style>
</head>
<body>
    <!-- HTML код остается таким же как в предыдущей версии -->
    <div class="container">
        <!-- Экран входа -->
        <div id="loginScreen" class="card">
            <div class="header">
                <h1>📚 Тестовая система</h1>
                <p>Проверка знаний по учебным дисциплинам</p>
            </div>
            <div class="content">
                <div class="form-group">
                    <label for="nameInput"><i class="fas fa-user"></i> Фамилия и Имя</label>
                    <input type="text" id="nameInput" class="form-control" placeholder="Иванов Иван">
                </div>
                
                <div class="form-group">
                    <label for="phoneInput"><i class="fas fa-phone"></i> Номер телефона</label>
                    <input type="tel" id="phoneInput" class="form-control" placeholder="998901234567">
                </div>
                
                <div class="form-group">
                    <label for="subjectSelect"><i class="fas fa-book"></i> Предмет</label>
                    <select id="subjectSelect" class="form-control">
                        <option value="anatomy">Анатомия</option>
                        <option value="biology">Биология</option>
                        <option value="chemistry">Химия</option>
                        <option value="physics">Физика</option>
                        <option value="history">История</option>
                        <option value="english">Английский язык</option>
                        <option value="latin">Латинский язык</option>
                        <option value="medical">Медицинская профессия</option>
                        <option value="uzbek">Узбекский язык</option>
                        <option value="histology">Гистология</option>
                        <option value="philosophy">Философия</option>
                    </select>
                </div>
                
                <button class="btn" onclick="tryLogin(event)">
                    <i class="fas fa-play-circle"></i> Начать тестирование
                </button>
                
                <a href="https://t.me/dr_samirshokh" class="dev-link" target="_blank">
                    <i class="fas fa-question-circle"></i> Техническая поддержка
                </a>
            </div>
        </div>

        <!-- Экран теста -->
        <div id="quizScreen" class="card hidden">
            <div class="quiz-header">
                <div class="timer" id="timer">30:00</div>
                <div class="question-counter" id="qCounter">1 / 30</div>
            </div>
            
            <div class="question-grid" id="qGrid"></div>
            
            <div class="question-content">
                <div class="question-container">
                    <div class="question-text" id="qText"></div>
                    <div class="options-container" id="optionsArea"></div>
                </div>
                
                <button id="reportBtn" class="report-btn" onclick="reportError()">
                    <i class="fas fa-exclamation-triangle"></i> Сообщить об ошибке
                </button>
            </div>
            
            <div class="navigation">
                <button class="btn" style="background: #9ca3af;" onclick="prevQuestion()">
                    <i class="fas fa-arrow-left"></i> Назад
                </button>
                <button class="btn" onclick="nextQuestion()">
                    Дальше <i class="fas fa-arrow-right"></i>
                </button>
            </div>
            
            <button id="finishBtn" class="btn btn-success" style="margin: 15px; border-radius: 10px;" onclick="finishTest()">
                <i class="fas fa-flag-checkered"></i> Завершить тест
            </button>
        </div>

        <!-- Экран результатов -->
        <div id="resultScreen" class="card hidden">
            <div class="header">
                <h1>🎉 Результаты теста</h1>
                <p>Тестирование завершено</p>
            </div>
            
            <div class="result-screen">
                <div class="result-score" id="scoreDisplay">0</div>
                <div class="result-message" id="resultMessage"></div>
                
                <div class="result-actions">
                    <button class="btn" onclick="reviewMode()">
                        <i class="fas fa-chart-bar"></i> Анализ ошибок
                    </button>
                    
                    <button class="btn btn-success" onclick="retrySameTest()">
                        <i class="fas fa-redo"></i> Пересдать этот вариант
                    </button>
                    
                    <button class="btn btn-warning" onclick="newTestSameSubject()">
                        <i class="fas fa-plus-circle"></i> Новый тест по предмету
                    </button>
                    
                    <button class="btn btn-danger" onclick="location.reload()">
                        <i class="fas fa-sign-out-alt"></i> Выйти в меню
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript код остается таким же как в предыдущей версии -->
    <script>
        // JavaScript код из предыдущей рабочей версии
        // Глобальные переменные
        let questions = [];
        let answers = {};
        let currentQuestionIndex = 0;
        let timeLeft = 30 * 60;
        let timerInterval;
        let currentUser = {};
        let isReviewMode = false;
        let currentTestId = null;
        let db = null;

        // Генерация deviceId
        let deviceId = localStorage.getItem('device_id') || 'web_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('device_id', deviceId);

        // Восстановление данных пользователя
        const savedUser = localStorage.getItem('lastUser');
        if (savedUser) {
            try {
                const user = JSON.parse(savedUser);
                document.getElementById('nameInput').value = user.name || '';
                document.getElementById('phoneInput').value = user.phone || '';
                if (user.subject) {
                    document.getElementById('subjectSelect').value = user.subject;
                }
            } catch(e) {
                console.log('Не удалось восстановить данные');
            }
        }

        // Инициализация Firebase (если config существует)
        if (typeof firebase !== 'undefined' && window.firebaseConfig) {
            try {
                firebase.initializeApp(window.firebaseConfig);
                db = firebase.firestore();
                console.log('Firebase успешно инициализирован');
            } catch (error) {
                console.error('Ошибка инициализации Firebase:', error);
            }
        } else {
            console.warn('Firebase config не найден. Работаем в оффлайн режиме.');
        }

        // ОСНОВНАЯ ФУНКЦИЯ ВХОДА
        async function tryLogin(event) {
            event.preventDefault();
            console.log("🟢 КНОПКА РАБОТАЕТ!");
            
            // Получаем данные из формы
            const name = document.getElementById('nameInput').value.trim();
            let phone = document.getElementById('phoneInput').value.trim();
            const subject = document.getElementById('subjectSelect').value;
            const btn = event.currentTarget;
            
            console.log("Введено:", {name, phone, subject});
            
            // Проверяем заполненность полей
            if (!name || !phone) {
                alert('Введите имя и номер телефона!');
                return;
            }
            
            if (!subject) {
                alert('Выберите предмет!');
                return;
            }
            
            // Форматируем телефон
            phone = phone.replace(/\D/g, '');
            
            if (phone.startsWith('8') && phone.length === 11) {
                phone = '998' + phone.substring(1);
            } else if (phone.startsWith('7') && phone.length === 11) {
                phone = '998' + phone.substring(1);
            } else if (phone.length === 10 && phone.startsWith('9')) {
                phone = '998' + phone;
            } else if (phone.length === 9) {
                phone = '998' + phone;
            }
            
            if (!phone.startsWith('998') || phone.length !== 12) {
                alert('Введите корректный номер телефона Узбекистана (например: 998901234567)');
                return;
            }
            
            // Сохраняем пользователя
            currentUser = { name, phone, subject };
            currentTestId = Date.now().toString(36);
            
            // Сохраняем в localStorage
            localStorage.setItem('lastUser', JSON.stringify({
                name: name,
                phone: phone,
                subject: subject
            }));
            
            // Блокируем кнопку
            btn.disabled = true;
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Загрузка вопросов...';
            
            try {
                // Загружаем вопросы
                await loadQuestions();
                
                // Переключаем экраны
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('quizScreen').classList.remove('hidden');
                
                // Инициализируем тест
                renderQuestionGrid();
                showQuestion(0);
                startTimer();
                
                console.log("🟢 ТЕСТ ЗАПУЩЕН!");
                
            } catch (error) {
                console.error('Ошибка при запуске теста:', error);
                alert('Ошибка загрузки теста. Попробуйте еще раз.');
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        }

        // ДЕМО ВОПРОСЫ
        function loadDemoQuestions() {
            questions = [
                {
                    text: "Рентгеноструктурный анализ - это метод...",
                    shuffledOptions: [
                        { text: "основанный на просвечивании контролируемых изделий рентгеновскими лучами", isCorrect: false },
                        { text: "изучение кристаллического вещества с помощью рентгеновского излучения", isCorrect: true },
                        { text: "анализа химического состава образцов по их рентгеновскими спектрами", isCorrect: false },
                        { text: "метод неразрушающего контроля материалов", isCorrect: false }
                    ],
                    correctIndex: 1
                },
                {
                    text: "Второй закон Ньютона формулируется как:",
                    shuffledOptions: [
                        { text: "Сила равна произведению массы на ускорение", isCorrect: true },
                        { text: "Действию всегда есть равное и противоположное противодействие", isCorrect: false },
                        { text: "Тело сохраняет состояние покоя или равномерного прямолинейного движения", isCorrect: false },
                        { text: "Энергия не создается и не уничтожается", isCorrect: false }
                    ],
                    correctIndex: 0
                }
            ];
            console.log("Загружены демо-вопросы");
        }

        // Загрузка вопросов и остальные функции остаются такими же
        async function loadQuestions() {
            const storageKey = `test_${currentUser.phone}_${currentUser.subject}`;
            const savedTest = localStorage.getItem(storageKey);
            
            if (savedTest) {
                try {
                    const parsed = JSON.parse(savedTest);
                    const savedTime = parsed.timestamp;
                    const currentTime = new Date().getTime();
                    const hoursDiff = (currentTime - savedTime) / (1000 * 60 * 60);
                    
                    if (hoursDiff < 24 && parsed.questions && parsed.questions.length > 0) {
                        questions = parsed.questions;
                        currentTestId = parsed.testId || currentTestId;
                        console.log('Используем сохраненный тест из localStorage');
                        return;
                    }
                } catch(e) {
                    console.log('Ошибка чтения сохраненного теста:', e);
                }
            }
            
            // Используем демо-вопросы
            console.log('Используем демо-вопросы');
            loadDemoQuestions();
        }

        function renderQuestionGrid() {
            const grid = document.getElementById('qGrid');
            grid.innerHTML = '';
            
            for (let i = 0; i < 30; i++) {
                const item = document.createElement('div');
                item.className = 'grid-item';
                item.textContent = i + 1;
                item.onclick = () => showQuestion(i);
                grid.appendChild(item);
            }
        }

        function showQuestion(index) {
            if (index < 0 || index >= questions.length) return;
            
            currentQuestionIndex = index;
            const question = questions[index];
            
            if (!question) {
                document.getElementById('qText').textContent = 'Вопрос не найден';
                document.getElementById('optionsArea').innerHTML = '';
                return;
            }
            
            // Обновляем счетчик
            document.getElementById('qCounter').textContent = `${index + 1} / ${questions.length}`;
            
            // Показываем текст вопроса
            document.getElementById('qText').textContent = question.text || 'Вопрос без текста';
            
            // Показываем варианты ответов
            const optionsArea = document.getElementById('optionsArea');
            optionsArea.innerHTML = '';
            
            if (!question.shuffledOptions || question.shuffledOptions.length === 0) {
                const noOptions = document.createElement('p');
                noOptions.textContent = 'Нет вариантов ответа';
                noOptions.style.color = 'red';
                optionsArea.appendChild(noOptions);
                return;
            }
            
            question.shuffledOptions.forEach((option, optionIndex) => {
                const button = document.createElement('button');
                button.className = 'option';
                button.textContent = option.text || 'Вариант без текста';
                
                if (isReviewMode) {
                    if (option.isCorrect) {
                        button.classList.add('correct');
                    }
                    if (answers[index] === optionIndex && !option.isCorrect) {
                        button.classList.add('wrong');
                    }
                } else {
                    if (answers[index] === optionIndex) {
                        button.classList.add('selected');
                    }
                    button.onclick = () => selectAnswer(optionIndex);
                }
                
                optionsArea.appendChild(button);
            });
            
            // Обновляем сетку вопросов
            document.querySelectorAll('.grid-item').forEach((item, i) => {
                item.classList.remove('active');
                item.classList.toggle('done', answers[i] !== undefined);
                
                if (i === index) {
                    item.classList.add('active');
                }
            });
        }

        function selectAnswer(optionIndex) {
            answers[currentQuestionIndex] = optionIndex;
            
            // Переходим к следующему вопросу через 0.5 секунды
            setTimeout(() => {
                if (currentQuestionIndex < questions.length - 1) {
                    showQuestion(currentQuestionIndex + 1);
                }
            }, 500);
        }

        function nextQuestion() {
            if (currentQuestionIndex < questions.length - 1) {
                showQuestion(currentQuestionIndex + 1);
            } else {
                alert('Это последний вопрос!');
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                showQuestion(currentQuestionIndex - 1);
            }
        }

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = 30 * 60;
            
            updateTimerDisplay();
            
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    finishTest();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            document.getElementById('timer').textContent = 
                `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
        }

        async function finishTest() {
            clearInterval(timerInterval);
            
            let correctCount = 0;
            questions.forEach((question, index) => {
                if (answers[index] !== undefined && question.shuffledOptions) {
                    if (question.shuffledOptions[answers[index]].isCorrect) {
                        correctCount++;
                    }
                }
            });
            
            // Показ результатов
            showResults(correctCount);
        }

        function showResults(score) {
            document.getElementById('quizScreen').classList.add('hidden');
            document.getElementById('resultScreen').classList.remove('hidden');
            
            const percentage = Math.round((score / questions.length) * 100);
            document.getElementById('scoreDisplay').textContent = `${score}/${questions.length}`;
            
            let message = '';
            if (percentage >= 90) {
                message = 'Отлично! Вы показали прекрасный результат!';
            } else if (percentage >= 70) {
                message = 'Хорошо! Вы хорошо справились с тестом.';
            } else if (percentage >= 50) {
                message = 'Удовлетворительно. Есть над чем поработать.';
            } else {
                message = 'Попробуйте еще раз. Изучите материал и возвращайтесь!';
            }
            
            document.getElementById('resultMessage').innerHTML = `
                ${message}<br><br>
                <strong>${score} из ${questions.length} правильных ответов (${percentage}%)</strong>
            `;
        }

        function reviewMode() {
            isReviewMode = true;
            document.getElementById('resultScreen').classList.add('hidden');
            document.getElementById('quizScreen').classList.remove('hidden');
            document.getElementById('finishBtn').style.display = 'none';
            document.getElementById('reportBtn').style.display = 'none';
            document.querySelector('.navigation').style.display = 'none';
            showQuestion(0);
        }

        function retrySameTest() {
            answers = {};
            timeLeft = 30 * 60;
            isReviewMode = false;
            
            document.getElementById('resultScreen').classList.add('hidden');
            document.getElementById('quizScreen').classList.remove('hidden');
            document.getElementById('finishBtn').style.display = 'block';
            document.getElementById('reportBtn').style.display = 'block';
            document.querySelector('.navigation').style.display = 'flex';
            
            showQuestion(0);
            startTimer();
        }

        function newTestSameSubject() {
            const storageKey = `test_${currentUser.phone}_${currentUser.subject}`;
            localStorage.removeItem(storageKey);
            location.reload();
        }

        function reportError() {
            alert('Функция сообщения об ошибке доступна при подключении к базе данных.');
        }
    </script>
</body>
</html>
